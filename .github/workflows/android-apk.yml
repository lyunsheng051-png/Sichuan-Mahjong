name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build offline landscape APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SHANGZHUO_DEBUG_KEYSTORE: ${{ github.workspace }}/.tools/cloud-debug.keystore
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: app
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check types
        run: npm run typecheck

      - name: Restore persistent debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_DEBUG_KEYSTORE_BASE64 repository secret. See docs/android.md."
            exit 1
          fi
          umask 077
          mkdir -p "$(dirname "$SHANGZHUO_DEBUG_KEYSTORE")"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$SHANGZHUO_DEBUG_KEYSTORE"
          keytool -list -keystore "$SHANGZHUO_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey > /dev/null

      - name: Build offline APK
        run: npm run android:apk

      - name: Verify APK and generate checksum
        env:
          APP_VERSION: ${{ steps.app.outputs.version }}
        run: |
          apk="shangzhuo-${APP_VERSION}-debug.apk"
          report=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "artifacts/$apk")
          printf '%s\n' "$report"
          expected=$(keytool -exportcert -keystore "$SHANGZHUO_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          actual=$(printf '%s\n' "$report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$expected" = "$actual" || { echo 'APK signing certificate differs from the persistent key'; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "artifacts/$apk"
          cd artifacts
          sha256sum "$apk" > SHA256SUMS.txt

      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shangzhuo-android-${{ steps.app.outputs.version }}-${{ github.run_number }}
          path: |
            artifacts/shangzhuo-${{ steps.app.outputs.version }}-debug.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Write download instructions
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo '### 上桌 · 川麻练习室 Android APK' >> "$GITHUB_STEP_SUMMARY"
          echo "[下载 APK 与 SHA256 校验文件]($ARTIFACT_URL)（保存 7 天）" >> "$GITHUB_STEP_SUMMARY"
          echo '下载并解压 ZIP，将 APK 传到安卓手机安装。调试包使用固定签名，支持以后同签名覆盖更新。' >> "$GITHUB_STEP_SUMMARY"
          echo '未进行安卓真机验证。' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$SHANGZHUO_DEBUG_KEYSTORE"
